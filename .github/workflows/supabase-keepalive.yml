name: Supabase keep-alive

# Keeps the free-tier Supabase project from auto-pausing after 7 days idle by
# running a real DB query on a schedule. It also writes a timestamp file and
# commits it each run, which counts as repo activity so GitHub never disables
# this scheduled workflow (GitHub disables cron after 60 days of no activity).
# Net effect: the project stays alive even if a human never touches the repo.
on:
  schedule:
    - cron: "0 6 */3 * *" # 06:00 UTC, every 3rd day
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # needed to push the heartbeat commit

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/projects?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          echo "HTTP status: ${status}"
          if [ "${status}" -ge 400 ]; then
            echo "Keep-alive query failed"
            exit 1
          fi
          echo "Keep-alive query succeeded"

      - name: Record heartbeat (keeps the workflow itself from being disabled)
        run: |
          set -euo pipefail
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt
          if git diff --cached --quiet; then
            echo "No change to commit"
          else
            git commit -m "chore: keep-alive heartbeat [skip ci]"
            git push
          fi
