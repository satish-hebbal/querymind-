name: Supabase keep-alive

# Prevents the free-tier Supabase project from auto-pausing after 7 days of
# inactivity by running a real DB query on a schedule (every 3 days).
on:
  schedule:
    - cron: "0 6 */3 * *" # 06:00 UTC, every 3rd day
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/projects?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          echo "HTTP status: ${status}"
          if [ "${status}" -ge 400 ]; then
            echo "Keep-alive query failed"
            exit 1
          fi
          echo "Keep-alive query succeeded"
